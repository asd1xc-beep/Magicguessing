<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Player Guess</title>
    <meta name="description" content="Guess an NBA player from five clues.">
    <meta property="og:title" content="NBA Player Guess">
    <meta property="og:description" content="Guess an NBA player from five clues.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#001f3f">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%80%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles.css">
</head>
<body class="text-white flex flex-col items-center py-8 px-4">
    <main class="w-full max-w-2xl flex flex-col items-center">
        <header class="text-center mb-7 w-full">
            <div class="flex justify-center items-center gap-3 mb-2">
                <span class="text-4xl" aria-hidden="true">🏀</span>
                <h1 id="page-title" class="text-4xl sm:text-5xl font-bold tracking-tight">NBA Player Guess</h1>
            </div>
            <p id="page-description" class="text-gray-300">Guess the player in 5 clues.</p>
            <label for="team-selector" class="block mt-5 mb-1 text-xs font-bold uppercase tracking-wider text-gray-400">Choose a team</label>
            <select id="team-selector" class="team-selector rounded-lg px-4 py-2 font-semibold" aria-label="Choose an NBA team"></select>
        </header>

        <nav id="mode-selector" class="glass-panel rounded-full p-1 mb-4 w-full max-w-md flex" aria-label="Game mode"></nav>
        <div id="status-bar" class="flex flex-wrap justify-center gap-2 mb-6 text-sm text-gray-200"></div>

        <section class="glass-panel w-full rounded-2xl shadow-2xl p-5 sm:p-8 mb-7" aria-labelledby="clues-heading">
            <div class="flex justify-between items-center mb-4 gap-3">
                <h2 id="clues-heading" class="text-xl font-bold team-accent">Clues</h2>
                <span id="guess-counter" class="text-sm font-bold bg-gray-800 px-3 py-1 rounded-full whitespace-nowrap">Guess 1 of 5</span>
            </div>

            <div id="clues-container" class="space-y-3 mb-8 min-h-[150px]"></div>

            <div id="daily-unavailable" class="hidden text-center py-4">
                <p id="daily-unavailable-message" class="text-amber-200 mb-4"></p>
                <button id="daily-practice-btn" class="secondary-button font-bold py-3 px-8 rounded-full shadow-lg transition-all active:scale-95">Play Practice Rounds</button>
            </div>

            <div id="game-controls" class="relative">
                <form id="guess-form" autocomplete="off" class="flex flex-row gap-2 sm:gap-3">
                    <div class="relative flex-1">
                        <input id="player-input" type="text" placeholder="Type a player name..." spellcheck="false" autocapitalize="words"
                               class="w-full bg-gray-900/80 border border-gray-600 text-white rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[var(--team-primary)] focus:border-transparent"
                               aria-label="Player name">
                    </div>
                    <button type="submit" class="primary-button font-bold py-3 px-5 sm:px-8 rounded-lg shadow-lg transition-all active:scale-95">Guess</button>
                </form>
                <p id="guess-message" class="text-sm text-amber-300 mt-2 min-h-[1.25rem]" aria-live="polite"></p>
            </div>

            <div id="post-game-controls" class="hidden text-center mt-4">
                <h3 id="game-result-title" class="text-2xl font-bold mb-2"></h3>
                <p id="game-result-answer" class="text-lg text-gray-300 mb-1"></p>
                <p id="game-result-points" class="text-amber-300 font-bold mb-1"></p>
                <p id="game-result-summary" class="text-sm text-gray-400 mb-6"></p>

                <div id="daily-extras" class="hidden">
                    <button id="share-btn" class="primary-button text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all active:scale-95">Share Result</button>
                    <p id="share-msg" class="text-sm text-green-300 mt-2 min-h-[1.25rem]" aria-live="polite"></p>
                    <div id="daily-stats" class="mt-4 mx-auto max-w-sm text-left"></div>
                    <p id="countdown" class="text-sm text-gray-300 mt-5"></p>
                    <button id="post-daily-practice-btn" class="mt-4 secondary-button font-bold py-3 px-8 rounded-full shadow-lg transition-all active:scale-95">Play Practice Rounds</button>
                </div>

                <button id="next-btn" class="secondary-button font-bold py-3 px-8 rounded-full shadow-lg transition-all active:scale-95">Next Player</button>
            </div>
        </section>

        <section class="w-full max-w-2xl" aria-labelledby="guesses-heading">
            <div class="flex flex-wrap justify-between items-end gap-2 mb-2 px-1">
                <h3 id="guesses-heading" class="text-lg font-bold text-gray-400">Your Guesses</h3>
                <p class="text-xs text-gray-300">
                    <span class="swatch t-g"></span>match
                    <span class="swatch t-y ml-2"></span>close
                    <span class="ml-2 font-bold">↑↓</span> answer is higher / lower
                </p>
            </div>
            <div id="guesses-history" class="space-y-2"></div>
        </section>

        <p id="data-note" class="text-xs text-gray-400 mt-10 text-center max-w-xl leading-relaxed"></p>
    </main>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
